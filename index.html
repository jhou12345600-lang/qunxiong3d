<!doctype html>
<html lang="zh-Hant">
<head>

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,sans-serif}
img{max-width:100%}

<title>群雄逐鹿 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D stage; lacquer-ink HUD hugging top and bottom edges; aged-paper scrolls for couriers and reports. One committed dark look. */
:root{
  --ink:#141219;
  --panel:rgba(21,19,27,.9);
  --panel-hi:rgba(42,36,48,.96);
  --bronze:#c49d5e;
  --bronze-dim:#6f5a3c;
  --paper:#eee0bf;
  --paper-ink:#2a2016;
  --cinnabar:#b5322a;
  --text:#efe7d6;
  --muted:#a69c8b;
  --good:#7cb36f;
  --bad:#dd6556;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","KaiTi",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:14px;overflow:hidden;position:relative;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}

#ui{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;pointer-events:none;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#ui .pe{pointer-events:auto}
.panel{background:var(--panel);border:1px solid var(--bronze-dim);border-radius:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

#top{display:flex;align-items:center;gap:10px;padding:8px 10px;flex-wrap:wrap}
.seal{width:40px;height:40px;flex:none;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);background:var(--c,#555);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),inset 0 -6px 10px rgba(0,0,0,.3)}
.who{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.who b{font-family:var(--f-display);font-size:18px;letter-spacing:.04em}
.who span{color:var(--muted);font-size:12px}
.res{display:flex;gap:12px;margin-left:auto;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.res div{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.res small{color:var(--muted);font-size:11px;letter-spacing:.1em}
.res b{font-size:15px}

#mid{flex:1;min-height:0;position:relative}
#toasts{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--panel-hi);border:1px solid var(--bronze-dim);border-radius:8px;padding:7px 12px;max-width:min(92%,460px);font-size:13px;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

#sheet{max-height:min(54vh,520px);overflow:auto;padding:12px 12px 14px;touch-action:pan-y;overscroll-behavior:contain}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sh-head h2{margin:0;font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.08em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 3px;border-radius:999px;background:rgba(255,255,255,.07);font-size:12px}
.chip i{width:16px;height:16px;border-radius:4px;background:var(--c);display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:11px;color:#fff}
.x{margin-left:auto;width:36px;height:36px;border-radius:8px;border:1px solid var(--bronze-dim);background:transparent;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em}
.stat b{font-size:15px}
.bar{height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bronze)}
.sect{font-family:var(--f-display);color:var(--bronze);font-size:14px;letter-spacing:.2em;margin:10px 0 6px}
.offs{display:flex;flex-wrap:wrap;gap:6px}
.off{font-size:13px;padding:4px 9px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06)}
.off.done{opacity:.45}
.cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}
.btn{font-family:var(--f-display);font-size:16px;letter-spacing:.06em;background:linear-gradient(#3a3243,#26212e);border:1px solid var(--bronze-dim);border-radius:8px;padding:9px 10px;min-height:44px;line-height:1.15}
.btn small{display:block;font-family:var(--f-body);font-size:10.5px;color:var(--muted);letter-spacing:0;margin-top:2px}
.btn.primary{background:linear-gradient(#c43f33,#8b261e);border-color:#dfa06a;color:#fff}
.btn.gold{background:linear-gradient(#8a6a34,#5c4421);border-color:#e0bb78}
.btn:disabled{opacity:.38;cursor:default}
.btn:not(:disabled):active{transform:translateY(1px)}

#dock{display:flex;gap:7px;padding:7px}
#dock .btn{flex:1;padding:8px 2px;font-size:14.5px;min-width:0;white-space:nowrap}
#dock .btn.primary{flex:1.4}

.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:30}
#modal{background:rgba(8,6,10,.55)}
#modal.ztop{z-index:46}
.cf-err{color:var(--bad);font-size:13px;min-height:1.2em;margin:6px 0 0}
.dialog{width:min(100%,520px);max-height:84vh;overflow:auto;padding:16px;touch-action:pan-y;overscroll-behavior:contain}
.dialog h3{margin:0 0 4px;font-family:var(--f-display);font-size:22px;letter-spacing:.06em}
.dialog p{margin:6px 0;line-height:1.6;color:#ddd3c0}
.dialog .sub{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.list{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.item{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:9px 10px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.item.on{border-color:var(--bronze);background:rgba(196,157,94,.16)}
.item:disabled{opacity:.4}
.item .nm{font-family:var(--f-display);font-size:17px;min-width:4.6em}
.item .meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;line-height:1.4;min-width:0}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.row .btn{min-width:96px}
input[type=range]{width:100%;accent-color:var(--cinnabar);height:32px}
.cf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.cf-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.cf-grid input{width:100%}
.cf-in{font:inherit;font-size:16px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--bronze-dim);border-radius:7px;padding:7px 8px;min-height:40px;min-width:0;-webkit-user-select:text;user-select:text;box-sizing:border-box}
select.cf-in{padding:6px 4px}
.cf-col{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.cf-sw{width:34px;height:34px;border-radius:8px;border:2px solid rgba(255,255,255,.15);background:var(--c)}
.cf-sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--cinnabar)}
.cf-p{padding:8px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);margin-top:7px}
.cf-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:6px;align-items:center}
.cf-h input{width:100%}
.cf-tag{font-family:var(--f-display);color:var(--bronze);font-size:13px;white-space:nowrap}
.cf-roll{min-height:40px!important;padding:4px 10px!important;font-size:15px!important}
.cf-st{font-size:12.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.cf-st b{color:var(--text);font-weight:500}
.big-num{font-family:var(--f-display);font-size:30px;text-align:center;font-variant-numeric:tabular-nums}

/* Courier scroll */
#report{background:rgba(10,6,4,.45);z-index:35}
.scroll{width:min(100%,460px);background:linear-gradient(180deg,#f3e7c9,#e6d3a8);color:var(--paper-ink);border-radius:4px;padding:22px 20px 16px;position:relative;box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 40px rgba(120,80,30,.25);border-top:10px solid #5b3a20;border-bottom:10px solid #5b3a20;animation:unroll .45s ease-out}
@keyframes unroll{from{transform:scaleY(.1);opacity:.3}to{transform:none;opacity:1}}
.scroll .kicker{font-family:var(--f-display);color:var(--cinnabar);font-size:15px;letter-spacing:.4em}
.scroll h3{font-family:var(--f-display);font-size:30px;margin:2px 0 8px;letter-spacing:.1em}
.scroll p{font-family:var(--f-display);font-size:18px;line-height:1.7;margin:0 0 12px}
.stamp{position:absolute;right:16px;top:16px;width:58px;height:58px;border:3px solid var(--cinnabar);color:var(--cinnabar);border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;font-weight:700;transform:rotate(-12deg);opacity:.85;line-height:1}
.scroll .btn{color:var(--text)}

/* Scene HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#hud .pe{pointer-events:auto}
.hud-top{display:flex;align-items:flex-start;gap:8px}
.hud-title{font-family:var(--f-display);font-size:20px;letter-spacing:.1em;text-shadow:0 2px 8px #000;padding-top:6px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-btns{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hud-btns .btn{min-height:38px;padding:6px 11px;font-size:14px}
.armies{display:flex;gap:8px;margin-top:8px}
.side{flex:1;padding:7px 10px;min-width:0}
.side .nm{font-family:var(--f-display);font-size:16px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .tr{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.side .hp{height:5px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:5px;overflow:hidden}
.side .hp i{display:block;height:100%;background:var(--c);transition:width .3s}
.side.r{text-align:right}.side.r .nm{justify-content:flex-end}
.hud-mid{flex:1;display:grid;place-items:center}
.banner{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,8vw,64px);letter-spacing:.12em;color:#fff3d6;text-shadow:0 0 18px rgba(180,50,30,.9),0 4px 10px #000;text-align:center;animation:bn .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes bn{from{transform:scale(1.8);opacity:0}to{transform:none;opacity:1}}
.subs{align-self:center;max-width:min(100%,640px);text-align:center;font-family:var(--f-display);font-size:clamp(17px,4.4vw,24px);line-height:1.55;text-shadow:0 2px 6px #000,0 0 14px #000;min-height:2em}
.advice{align-self:center;width:min(100%,560px);display:flex;flex-direction:column;gap:6px}
.adv{padding:10px 12px;display:flex;gap:10px;align-items:center}
.adv .who2{font-family:var(--f-display);font-size:16px;color:var(--bronze);white-space:nowrap}
.adv p{margin:0;font-size:13.5px;line-height:1.5;flex:1;min-width:0}
.adv .btn{min-height:36px;padding:5px 10px;font-size:14px;flex:none}
.adv .ares{color:var(--good);font-weight:500}
.duel-cmd{align-self:center;display:flex;gap:8px;width:min(100%,460px);margin-top:8px}.duel-cmd .btn{flex:1;min-height:54px;font-size:18px}
.dlog{align-self:center;text-align:center;font-size:14px;min-height:1.4em;color:#f1e6cf;text-shadow:0 2px 6px #000,0 0 10px #000;margin-top:4px}
.advice{max-height:46vh;overflow:auto;touch-action:pan-y}

/* Title */
#title{z-index:40;background:radial-gradient(ellipse at 50% 40%,rgba(20,16,24,.25),rgba(12,10,14,.85));flex-direction:column;gap:14px;overflow:auto;justify-content:flex-start;touch-action:pan-y}
.logo{font-family:var(--f-display);font-weight:700;font-size:clamp(52px,15vw,104px);letter-spacing:.14em;line-height:1;color:#f6ead0;text-shadow:0 0 30px rgba(181,50,42,.65),0 6px 18px #000;margin-top:max(6vh,20px);text-align:center}
.tag{font-family:var(--f-display);color:var(--bronze);letter-spacing:.5em;font-size:15px;text-align:center}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:min(100%,720px)}
.fcard{display:flex;gap:10px;align-items:center;padding:10px;text-align:left}
.fcard b{font-family:var(--f-display);font-size:18px;display:block}
.fcard span{color:var(--muted);font-size:12px}
.lead{max-width:34em;text-align:center;color:#d6ccb8;line-height:1.7;margin:0}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:760px){#sheet{width:420px;align-self:flex-start}}
</style>

<div id="stage"></div>
<div id="ui" hidden>
  <header id="top" class="panel pe"></header>
  <div id="mid"><div id="toasts"></div></div>
  <section id="sheet" class="panel pe" hidden></section>
  <nav id="dock" class="panel pe">
    <button class="btn" id="bCouncil">議事廳</button>
    <button class="btn" id="bDiplo">外交</button>
    <button class="btn" id="bLord">君主</button>
    <button class="btn" id="bInfo">情勢</button>
    <button class="btn primary" id="bEnd">結束本月</button>
  </nav>
</div>
<div id="hud" hidden></div>
<div id="modal" class="ov" hidden></div>
<div id="report" class="ov" hidden></div>
<div id="title" class="ov" hidden></div>
<div id="boot" class="ov" style="z-index:50;background:var(--ink);flex-direction:column;gap:14px"><div class="logo" style="margin-top:0">群雄逐鹿</div><div class="tag" id="bootMsg">正在繪製天下地圖…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';
// ================= 工具 =================
const $=s=>document.querySelector(s);
const R=Math.random;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const pick=a=>a[Math.floor(R()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function hash(x,y){const h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(hash(xi,yi),hash(xi+1,yi),u),lerp(hash(xi,yi+1),hash(xi+1,yi+1),u),v);}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5;}return s;}
const fmt=n=>{n=Math.round(n);return Math.abs(n)>=10000?(n/10000).toFixed(n>=100000?0:1)+'萬':String(n);};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// ================= 音效（合成） =================
// ================= 語音 =================
const VOICE={on:true,v:null,ok:typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined',warmed:false,
  pick(){if(!this.ok)return;try{const vs=speechSynthesis.getVoices();this.v=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh[-_]HK/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||vs.find(v=>/cmn/i.test(v.lang))||null;}catch(e){}},
  warm(){if(!this.ok||this.warmed)return;this.warmed=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}},
  say(text,opt={}){if(!this.on||!this.ok||!text)return;try{let who=opt.name||null,body=String(text);const m=body.match(/^([^：:\s]{1,6})[：:](.+)$/);if(m){who=m[1];body=m[2];}
    body=body.replace(/[「」『』（）()]/g,' ').replace(/——/g,'，');if(!opt.queue)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(body);u.lang=this.v?this.v.lang:'zh-TW';if(this.v)u.voice=this.v;
    const p=speakerVoice(who);u.pitch=p.pitch;u.rate=p.rate;u.volume=1;speechSynthesis.speak(u);}catch(e){}},
  stop(){try{if(this.ok)speechSynthesis.cancel();}catch(e){}}};
if(VOICE.ok){VOICE.pick();try{speechSynthesis.addEventListener('voiceschanged',()=>VOICE.pick());}catch(e){}}
function speakerVoice(who){if(!who)return{pitch:1,rate:1.08};
  if(LADIES_DATA.some(l=>l.name===who))return{pitch:1.6,rate:1.12};
  const o=(typeof G!=='undefined'&&G&&G.o)?G.o.find(x=>x.name===who):null;
  if(o&&o.female)return{pitch:1.6,rate:1.12};
  if(Object.values(FACTIONS).some(f=>f.ruler===who))return{pitch:.82,rate:1.0};
  if(o&&o.war>=85&&o.war>o.int)return{pitch:.6,rate:1.06};
  if(o&&o.int>=85)return{pitch:1.0,rate:1.02};
  return{pitch:.9,rate:1.08};}
const AU={ctx:null,on:true,noise:null,
  init(){VOICE.warm();if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();const b=this.ctx.createBuffer(1,this.ctx.sampleRate,this.ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;this.noise=b;}catch(e){this.ctx=null;}},
  ok(){return this.ctx&&this.on;},
  env(g,t,a,p,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);},

function inPoly(p,x,y){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}

  h+=sstep(106.5,103,lon)*sstep(28.5,26,lat)*2.0;
  h+=sstep(40.6,42,lat)*sstep(117.5,114,lon)*1.5;
  for(const r of RIDGES){const d=segDist(lon,lat,r[0],r[1],r[2],r[3]);if(d<r[5]*3.5)h+=r[4]*Math.exp(-(d*d)/(2*r[5]*r[5]))*(.7+.6*fbm(lon*2.3,lat*2.3));}

async function runCmd(cmd,n){if(BUSY)return;AU.init();BUSY=true;try{
  if(cmd==='commerce'||cmd==='farm')await doDev(n,cmd);else if(cmd==='recruit')await doRecruit(n);else if(cmd==='wall')await doDev(n,'def');else if(cmd==='train')await doTrain(n);else if(cmd==='search')await doSearch(n);else if(cmd==='siege')await doSiege(n);
  else if(cmd==='march')await doMarch(n);else if(cmd==='move')await doMove(n);else if(cmd==='diplo'){closeSheet();await doDiplomacy(c_f(n));}else if(cmd==='visit'){$('#sheet').hidden=true;await cityScene(n);$('#sheet').hidden=false;}

function modal(html){const m=$('#modal');m.innerHTML=`<div class="dialog panel" role="dialog">${html}</div>`;m.hidden=false;return m;}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';m.classList.remove('ztop');}
function dlg(title,body,buttons){return new Promise(res=>{const m=modal(`<h3>${esc(title)}</h3>${body}<div class="row">${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>`);
  m.querySelectorAll('.row .btn').forEach(b=>b.onclick=()=>{closeModal();res(buttons[+b.dataset.i].value);});});}
const offMeta=o=>`統 ${o.lead}・武 ${o.war}・智 ${o.int}・政 ${o.pol}・魅 ${o.cha}${o.loy&&o.f!==null?'・忠 '+o.loy:''}${o.sworn?'・已結義':''}${o.spouse?'・已婚':''}`;
const offItem=o=>({id:o.id,label:o.name,meta:offMeta(o)});
function choose(title,sub,items,{min=1,max=1,ok='確定'}={}){return new Promise(res=>{const sel=[];
  const m=modal(`<h3>${esc(title)}</h3><div class="sub">${esc(sub||'')}</div><div class="list">${items.map((it,i)=>`<button class="item" data-i="${i}" ${it.dis?'disabled':''}>${it.color?`<span class="seal" style="--c:${it.color};width:30px;height:30px;font-size:16px">${it.mark||''}</span>`:''}<span class="nm">${esc(it.label)}</span><span class="meta">${esc(it.meta||'')}</span></button>`).join('')}</div>
    <div class="row"><button class="btn" id="cC">取消</button>${max>1||min===0?`<button class="btn primary" id="cOK">${ok}</button>`:''}</div>`);
  m.querySelectorAll('.item').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(max===1&&min===1){closeModal();res(items[i].id);return;}
    const k=sel.indexOf(i);if(k>=0){sel.splice(k,1);b.classList.remove('on');}else if(sel.length<max){sel.push(i);b.classList.add('on');}});
  $('#cC').onclick=()=>{closeModal();res(null);};const okb=$('#cOK');if(okb)okb.onclick=()=>{if(sel.length<min){toast(`請至少選擇 ${min} 項`);return;}closeModal();res(sel.map(i=>items[i].id));};});}
function chooseNum(title,sub,min,max,step,val){return new Promise(res=>{const m=modal(`<h3>${esc(title)}</h3><div class="sub">${esc(sub)}</div><div class="big-num" id="nV">${val}</div><input type="range" id="nR" min="${min}" max="${max}" step="${step}" value="${val}"><div class="row"><button class="btn" id="nC">取消</button><button class="btn primary" id="nO">確定</button></div>`);
  const r=$('#nR');r.oninput=()=>$('#nV').textContent=r.value;$('#nC').onclick=()=>{closeModal();res(null);};$('#nO').onclick=()=>{closeModal();res(+r.value);};});}
function showReport(ev){return new Promise(res=>{const m=$('#report');VOICE.say(`${ev.title}。${ev.text}`);m.innerHTML=`<div class="scroll"><div class="stamp">${esc(ev.stamp||'報')}</div><div class="kicker">${esc(ev.kicker||'急報')}</div><h3>${esc(ev.title)}</h3><p>${esc(ev.text)}</p><div class="row">${(ev.options||[{label:'知道了'}]).map((o,i)=>`<button class="btn ${i===0&&ev.options&&ev.options.length>1?'primary':''}" data-i="${i}">${esc(o.label)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</button>`).join('')}</div></div>`;m.hidden=false;
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{VOICE.stop();m.hidden=true;m.innerHTML='';const o=(ev.options||[])[+b.dataset.i];if(o&&o.fn)o.fn();res(+b.dataset.i);});});}
async function courierReport(ev,f){let sc=null;if(G.set.anim){try{sc=await courierScene(f);}catch(e){console.error(e);}}
  await showReport(ev);if(sc)sc.end();refreshUI();refreshMap();}

async function doDev(n,key,fromCouncil){const c=G.c[n],F=G.f[G.player];const cap=capOf(n);const statKey=key==='def'?'lead':'pol';
  const idle=idleOffs(n);if(!idle.length)return toast(`${n}沒有可行動的武將`);if(F.gold<300)return toast('金錢不足');if(c[key]>=cap[key])return toast('已達上限');
  const o=bestBy(idle,statKey);const gain=Math.min(cap[key]-c[key],(key==='def'?20:15)+Math.floor(o[statKey]/4)+Math.floor(R()*10));
  F.gold-=300;c[key]+=gain;o.done=true;const name={commerce:'商業',farm:'農業',def:'城防'}[key];
  if(key==='farm'&&G.set.anim)await farmScene(n,o,gain);
  toast(`${o.name}於${n}${key==='def'?'修築城牆':key==='farm'?'開墾農田':'發展商業'}，${name} +${gain}`);}
const trainMul=t=>1+(t||0)/400;
async function doTrain(n){const c=G.c[n],F=G.f[G.player];const idle=idleOffs(n);if(!idle.length)return toast(`${n}沒有可行動的武將`);if(F.gold<200)return toast('金錢不足');if((c.train||0)>=100)return toast('訓練已達上限');
  const o=bestBy(idle,'lead');const g=Math.min(100-(c.train||0),10+Math.floor(o.lead/8));F.gold-=200;c.train=(c.train||0)+g;o.done=true;toast(`${o.name}於${n}操練士卒，訓練 +${g}（${c.train}）`);}
async function doRecruit(n){const c=G.c[n],F=G.f[G.player];const idle=idleOffs(n);if(!idle.length)return toast(`${n}沒有可行動的武將`);if(F.gold<400)return toast('金錢不足');
  const o=bestBy(idle,'cha');const amt=Math.min(Math.round((1000+o.cha*15)/100)*100,Math.floor(c.pop*.08));if(amt<300)return toast('人口不足，無法徵兵');
  F.gold-=400;c.troops+=amt;c.pop-=amt;c.train=Math.round((c.train||0)*(c.troops-amt)/c.troops);o.done=true;if(G.set.anim)await recruitScene(n,o,amt);toast(`${o.name}於${n}徵得新兵 ${amt} 人`);}
async function doSearch(n){const c=G.c[n];const idle=idleOffs(n);if(!idle.length)return toast(`${n}沒有可行動的武將`);const o=bestBy(idle,'cha');o.done=true;
  const hid=G.o.filter(x=>x.f===null&&x.c===n);const t=hid.find(x=>x.rumor)||pick(hid.length?hid:[null]);
  if(t&&R()<.32+o.cha/250+(t.rumor?.45:0)){
    if(t.name==='諸葛亮'&&G.visits<2){G.visits++;t.rumor=true;return showReport({kicker:'尋訪',stamp:'訪',title:`${['一','二'][G.visits-1]}顧茅廬`,text:`${o.name}來到隆中草廬，童子道：「先生今早出遊，不知何時歸來。」只得悵然而返。（再訪 ${3-G.visits} 次或可得見）`});}
    const p=t.name==='諸葛亮'?1:clamp(.45+o.cha/300-(t.int>95?.15:0),.15,.95);const ok=R()<p;
    if(ok){t.f=G.player;t.hidden=false;t.loy=82;t.done=true;t.c=n;if(G.set.anim)await surrenderScene(t,true,'recruit');toast(`${t.name}受${o.name}之邀，加入我軍！`);}
    else{t.rumor=true;await showReport({kicker:'尋訪',stamp:'訪',title:`找到 ${t.name}`,text:`${o.name}在${n}尋得${t.name}，然其婉言謝絕：「容在下再思量。」或許改日再訪。`});}
  }else{const g=Math.random()<.4?Math.round(100+R()*300):0;if(g){G.f[G.player].gold+=g;toast(`${o.name}在${n}尋訪無果，卻意外得到金 ${g}`);}else toast(`${o.name}在${n}四處尋訪，一無所獲`);}}
async function doSiege(n){const c=G.c[n],F=G.f[G.player],cost=siegeCost(n);const idle=idleOffs(n);if(!idle.length)return toast(`${n}沒有可行動的武將`);if(F.gold<cost)return toast('金錢不足');if((c.siege||0)>=4)return toast('兵器已滿');
  const o=bestBy(idle,'int');o.done=true;F.gold-=cost;c.siege=(c.siege||0)+1;toast(`${o.name}督造攻城兵器，${n}兵器 ${c.siege} 座`);}
async function doMarch(from){const c=G.c[from],idle=idleOffs(from);if(c.cool>G.turn)return toast(`${from}剛打下，尚需整頓 ${c.cool-G.turn} 個月`);if(!idle.length)return toast('沒有可出征的武將');if(c.troops<1000)return toast('兵力不足 1000');
  const tg=ADJ[from].filter(m=>G.c[m].f!==G.player);if(!tg.length)return toast('鄰近沒有可攻打的城池');
  const t=await choose('出征目標',`自${from}出發`,tg.map(m=>{const e=G.c[m],tr=e.f&&treaty(e.f);return{id:m,label:(isWater(from,m)?'⛵ ':'')+m,dis:!!tr,meta:tr?`${FACTIONS[e.f].ruler}軍・${tr.type==='ally'?'同盟中':'停戰中'}，不可攻打`:`${e.f?FACTIONS[e.f].ruler+'軍':'中立'}・守軍 ${fmt(e.troops)}・城防 ${e.def}・武將 ${offsIn(m).length}`,color:e.f?FACTIONS[e.f].color:'#666',mark:e.f?FACTIONS[e.f].flag:'民'};}));
  if(!t)return;MAP.tring.visible=true;MAP.tring.position.copy(cityPos(t));MAP.tring.position.y+=.25;
  const sel=await choose('出征武將','選 1–3 人，統率與武力最高者擔任主將',idle.map(offItem),{min:1,max:3});if(!sel){MAP.tring.visible=false;return;}
  const F=G.f[G.player];const maxT=Math.min(c.troops,Math.floor(F.food/.15/500)*500);if(maxT<1000){MAP.tring.visible=false;return toast('糧草不足，無法出征');}
  const n=await chooseNum('出征兵力',`${from}兵力 ${fmt(c.troops)}，每千兵耗糧 150`,1000,maxT,500,Math.max(1000,Math.min(maxT,Math.round(c.troops*.7/500)*500)));MAP.tring.visible=false;if(!n)return;
  let sg=0;if((c.siege||0)>0){if(isWater(from,t))toast('水路進軍，攻城兵器無法隨行');else{sg=await chooseNum('攜帶攻城兵器','投石車、衝車、雲梯、井闌：數量越多，越能削弱城防',0,c.siege,1,c.siege);if(sg===null)sg=0;}}
  F.food-=Math.round(n*.15);const a=dispatch(G.player,from,t,sel.map(OF),n,sg);syncArmies();
  toast(`${OF(a.offs[0]).name}率兵 ${fmt(n)} 自${from}出征${t}，${a.turns>1?a.turns+'個月':'下月'}抵達`);closeSheet();await offerJoint(a);}
// ================= 同盟合擊 =================
function allyHelpers(t){const tf=G.c[t].f;return Object.keys(FACTIONS).filter(k=>k!==G.player&&G.f[k].alive&&treaty(k)&&treaty(k).type==='ally'&&k!==tf&&!friendly(k,tf)&&citiesOf(k).some(c=>ADJ[c.name].includes(t)&&c.troops>=3000&&offsIn(c.name).length));}
function jointChance(k){return clamp(.4+(G.rel[k]-50)/70,.15,.92);}
function allyDispatch(k,t,turns,support){const src=citiesOf(k).filter(c=>ADJ[c.name].includes(t)&&offsIn(c.name).length&&c.troops>=3000).sort((x,y)=>y.troops-x.troops)[0];if(!src)return null;
  const n=Math.round(src.troops*.5/100)*100;const offs=offsIn(src.name).slice().sort((x,y)=>(y.lead+y.war)-(x.lead+x.war));const take=offs.length>1?offs.slice(0,Math.min(2,offs.length-1)):offs;
  const b=dispatch(k,src.name,t,take,n,isWater(src.name,t)?0:Math.min(2,src.siege||0));if(turns)b.turns=Math.max(1,turns);if(support)b.support=support;return b;}
async function offerJoint(a){const t=a.to;for(const k of allyHelpers(t)){const p=jointChance(k),F=G.f[G.player];
    const ok=await dlg('聯軍合擊',`<p>盟友 ${esc(FACTIONS[k].ruler)} 在${t}附近屯有重兵。是否遣使請其同時出兵，與我軍合擊${t}？</p><p class="sub">金 300・成功率約 ${Math.round(p*100)}%・兩軍同時抵達、合兵攻城，打下的城池歸我軍</p>`,[{label:'不必',value:false},{label:'邀請合擊',value:true,cls:'primary'}]);
    if(!ok)continue;if(F.gold<300){toast('金錢不足');break;}F.gold-=300;
    if(R()<p){const b=allyDispatch(k,t,a.turns,G.player);if(b){G.rel[k]=Math.max(0,G.rel[k]-3);syncArmies();toast(`${FACTIONS[k].ruler}應允！${OF(b.offs[0]).name}率兵 ${fmt(b.troops)} 自${b.from}出發，與我軍合擊${t}`,4500);}else toast(`${FACTIONS[k].ruler}兵力不足，無法出兵`);}
    else toast(`${FACTIONS[k].ruler}推說兵馬未整，婉拒出兵`);}}
const convoyTurns=(a,b)=>1+Math.floor(cityDist(a,b)/(isWater(a,b)?16:11));
async function doMove(from){const c=G.c[from];const tg=ADJ[from].filter(m=>G.c[m].f===G.player);if(!tg.length)return toast('鄰近沒有我方城池');
  if(c.cool>G.turn)return toast(`${from}整頓中，${c.cool-G.turn} 個月後才能輸送`);
  const t=await choose('輸送目的地',`自${from}調動・輸送隊需行軍，抵達後該城整頓 1 個月`,tg.map(m=>({id:m,label:m,meta:`兵 ${fmt(G.c[m].troops)}・武將 ${offsIn(m).length}・約 ${convoyTurns(from,m)} 個月抵達`})));if(!t)return;
  const offs=offsIn(from).filter(o=>!o.done);let sel=[];if(offs.length){sel=await choose('隨隊武將','可不選（本月已行動的武將不能隨行）',offs.map(offItem),{min:0,max:offs.length});if(sel===null)return;}
  const maxT=Math.floor(c.troops*.6/500)*500;const n=maxT>=500?await chooseNum('輸送兵力',`${from}兵力 ${fmt(c.troops)}，一次最多輸送六成`,0,maxT,500,0):0;if(n===null)return;
  if(!n&&!sel.length)return toast('沒有輸送任何兵將');

  toast(`輸送隊自${from}出發：兵 ${fmt(n)}${sel.length?'、武將 '+sel.map(i=>OF(i).name).join('、'):''}，${a.turns} 個月後抵達${t}`);closeSheet();}

    duelMod=W==='att'?[.15,-.08]:[-.08,.15];offs=a.offs.map(OF);defOffs=defF?offsIn(a.to,defF):[];gA=bestGen(offs);gD=bestGen(defOffs);
    if(!offs.length&&W==='def'){splitSup();retreat(a);if(pi)await dlg('主將被擒',`<p>${esc(duelTxt)}全軍無人統領，只得撤退。</p>`,[{label:'返回地圖',value:0,cls:'primary'}]);return;}
    if(pi&&G.set.watch&&duel.shown)watch=await dlg('單挑結果',`<p>${esc(duelTxt)}</p><p>${a.f===G.player?'大軍隨即攻城！':'敵軍仍然揮兵攻城！'}攻方 ${fmt(a.troops)}，守軍 ${fmt(tc.troops)}。</p>`,[{label:'直接結算',value:false},{label:'觀看 3D 戰鬥',value:true,cls:'primary'}]);}
  let qa=armyQuality([gA,...offs.filter(o=>o!==gA)]),qd=armyQuality([gD,...defOffs.filter(o=>o!==gD)]);if(duelMod){qa+=duelMod[0];qd+=duelMod[1];}else if(duel){if(duel.win==='att'){qa+=.06;qd-=.02;}else{qd+=.06;qa-=.02;}}
  if(a.horse)qa*=1.05;let res,fire=null;
  if(naval){qa=armyQuality([gA,...offs.filter(o=>o!==gA)])*navalSkill(a.f)*(a.port?1.1:1);qd=armyQuality([gD,...defOffs.filter(o=>o!==gD)])*navalSkill(defF)*(specOf(a.to)==='港'?1.1:1);
    qa*=trainMul(a.train);qd*=trainMul(tc.train);res=resolveBattle(a.troops,qa,tc.troops,qd,tc.def*.25);const wg=res.winner==='att'?gA:gD;if(wg&&wg.int>=82&&R()<.6){fire=res.winner;if(fire==='att')res.defLoss=Math.min(tc.troops,Math.round(res.defLoss*1.15));else res.attLoss=Math.min(a.troops,Math.round(res.attLoss*1.15));}}

const duelP=(A,B)=>clamp(.5+(A.war-B.war)/36,.1,.9);
async function captureDefender(o,a){const oldF=o.f,byF=a.f;const ruler=!!(oldF&&FACTIONS[oldF]&&o.name===FACTIONS[oldF].ruler);

    if(ok){o.f=G.player;o.loy=66;o.c=null;o.army=a.id;a.offs.push(o.id);toast(`${o.name}歸降我軍，隨軍出戰`);}else{releaseOfficer(o,oldF,a.to);if(o.c===a.to)freeOfficer(o);toast(`${o.name}寧死不降，被逐出戰場`);}}

function endSafe(){if(SCENE_ACTIVE){HUD.hidden=true;SCENE_ACTIVE=false;setView(MAP.view);$('#ui').hidden=false;}}

async function captureCity(a,defF,defOffs,offs,info,forceCap){const tc=G.c[a.to];tc.train=Math.round(a.train||0);tc.siege=(a.siege||0);tc.cool=G.turn+2;if(a.f===G.player&&defF)G.rel[defF]=Math.max(0,G.rel[defF]-25);tc.f=a.f;tc.troops+=a.troops;offs.forEach(o=>{o.c=a.to;o.army=null;});removeArmy(a);

function aiTurn(f){const F=G.f[f],cs=citiesOf(f),warn=[];if(!cs.length)return warn;
  for(const c of cs){if(offsIn(c.name).length)continue;const src=ADJ[c.name].filter(n=>G.c[n].f===f).map(n=>offsIn(n).filter(o=>!o.done&&o.name!==FACTIONS[f].ruler)).filter(l=>l.length>=2).sort((a,b)=>b.length-a.length)[0];if(src){const o=src.sort((a,b)=>(a.lead+a.war)-(b.lead+b.war))[0];o.c=c.name;o.done=true;}}
  for(const c of cs){const free=G.o.filter(o=>o.f===null&&o.c===c.name);for(const o of free){if(R()<(o.int>=95||o.war>=95?.025:.1)){o.f=f;o.hidden=false;o.loy=72;o.c=c.name;o.rumor=false;logMsg(`${o.name}投效${FACTIONS[f].ruler}`);break;}}}
  const border=c=>ADJ[c.name].some(n=>G.c[n].f!==f);
  for(const c of shuffle(cs.slice())){const cap=capOf(c.name),bd=border(c),want=bd?9000+CITY_BY[c.name].size*5000:4000+CITY_BY[c.name].size*1500;
    for(const o of idleOffs(c.name).slice(0,3)){if(F.gold<300)break;
      if(c.troops<want&&F.gold>=400&&c.pop>50000){const amt=Math.round((1000+o.cha*15)*1.45);c.troops+=amt;c.pop-=amt;F.gold-=400;c.train=Math.round((c.train||0)*(c.troops-amt)/c.troops);}
      else if(bd&&(c.train||0)<75&&F.gold>=200&&R()<.5){c.train=Math.min(100,(c.train||0)+10+Math.floor(o.lead/8));F.gold-=200;}
      else{const ks=['commerce','farm','def'].filter(k=>c[k]<cap[k]);if(!ks.length)continue;const k=ks.sort((a,b)=>c[a]/cap[a]-c[b]/cap[b])[0];c[k]=Math.min(cap[k],c[k]+15+Math.floor(o[k==='def'?'lead':'pol']/4));F.gold-=300;}o.done=true;}
    if(bd&&(c.siege||0)<3&&F.gold>2000&&R()<.35){c.siege=(c.siege||0)+1;F.gold-=siegeCost(c.name);}
    if(!bd&&c.troops>want+2000){const to=ADJ[c.name].map(n=>G.c[n]).filter(x=>x.f===f&&border(x)).sort((a,b)=>a.troops-b.troops)[0]||ADJ[c.name].map(n=>G.c[n]).filter(x=>x.f===f).sort((a,b)=>a.troops-b.troops)[0];if(to){const n=c.troops-want;c.troops-=n;to.troops+=n;}}}
  const coal=inCoal(f);const atk=(cs.length>=4?2:1)+(coal?1:0);let made=0;

        const eq=armyQuality([bestGen(e.f?offsIn(n):[])]);const sgc=isWater(c.name,n)?0:Math.min(4,c.siege||0);const r=trainMul(c.train)/trainMul(e.train)*c.troops*.7*(armyQuality([g])+.04*sgc)*(isWater(c.name,n)?navalSkill(f)/navalSkill(e.f):1)/((e.troops+300)*eq*(1+e.def*(1-.2*sgc)/1500));const th=e.f===G.player?(coal?.95:G.turn>=12?1.05:1.15):1.25;if(r>th){const s=r+(e.f?0:1.5)+(e.f===G.player&&G.rel[f]<30?.3:0)+(e.f===G.player&&coal?1.2:0)+R()*.4;if(!best||s>best.s)best={s,c,n,all,g};}}}
    if(best){const dep=best.all.filter(o=>o!==best.g).sort((a,b)=>b.war-a.war).slice(0,1);const keep=best.all.length>1?[best.g,...dep].slice(0,best.all.length-1):[best.g];
      const a=dispatch(f,best.c.name,best.n,keep,Math.round(best.c.troops*.7),isWater(best.c.name,best.n)?0:(best.c.siege||0));made++;if(G.c[best.n].f===G.player){warn.push(a);G.rel[f]=Math.max(0,G.rel[f]-10);}else logMsg(`${FACTIONS[f].ruler}軍出兵${best.n}`);}}

// ================= 反我聯軍 =================
const inCoal=f=>!!(G&&G.coal&&G.coal.members.includes(f));
function friendly(a,b){if(!a||!b)return false;if(a===b)return true;const pl=G.player;if(a===pl)return !!treaty(b);if(b===pl)return !!treaty(a);return inCoal(a)&&inCoal(b);}
const coalName=()=>`反${FACTIONS[G.player].ruler}聯軍`;
function leaveCoalition(f,byPlayer){const C=G.coal;if(!C)return;C.members=C.members.filter(x=>x!==f);if(byPlayer){G.rel[f]=Math.min(100,G.rel[f]+10);G.treaty[f]={type:'truce',until:G.turn+6};toast(`${FACTIONS[f].ruler}退出${coalName()}，並與我停戰 6 個月`,4500);}
  if(C.members.length<2||!C.members.includes(C.leader)&&C.members.length<3){G.coal=null;G.coalCD=G.turn+8;toast(`${coalName()}群龍無首，就此瓦解！`,4500);logMsg('反我聯軍瓦解');}
  else if(!C.members.includes(C.leader))C.leader=C.members.slice().sort((a,b)=>power(b)-power(a))[0];}
function coalitionMonthly(){const pl=G.player,C=G.coal;
  if(C){C.members=C.members.filter(f=>G.f[f].alive&&!(treaty(f)&&treaty(f).type==='ally'));
    if(C.until<=G.turn||C.members.length<2){G.coal=null;G.coalCD=G.turn+8;toast(`${coalName()}${C.until<=G.turn?'盟約期滿，':''}各自散去`,4500);logMsg('反我聯軍瓦解');return null;}
    if(!C.members.includes(C.leader))C.leader=C.members.slice().sort((a,b)=>power(b)-power(a))[0];
    const bd=borderFactions(pl),front=C.members.filter(f=>bd.includes(f));
    for(const f of C.members){if(front.includes(f)||!front.length)continue;const src=citiesOf(f).sort((a,b)=>b.troops-a.troops)[0];if(!src||src.troops<7000||R()>.5)continue;
      const to=pick(front);const tc=citiesOf(to).filter(c=>ADJ[c.name].some(n=>G.c[n].f===pl)).sort((a,b)=>a.troops-b.troops)[0];if(!tc)continue;const n=Math.round(src.troops*.25/100)*100;src.troops-=n;tc.troops+=n;logMsg(`聯軍：${FACTIONS[f].ruler}遣兵 ${fmt(n)} 增援${tc.name}`);}
    return null;}
  if(G.turn<8||(G.coalCD||0)>G.turn)return null;
  const alive=Object.keys(FACTIONS).filter(k=>k!==pl&&G.f[k].alive);if(alive.length<2)return null;
  const pp=power(pl),pc=citiesOf(pl).length,top=Math.max(...alive.map(power));
  if(!(pc>=5||pp>top*1.25||(pc>=4&&pp>top*.9)))return null;if(R()>.4)return null;
  const bd=borderFactions(pl);const cand=alive.filter(f=>!treaty(f)&&G.rel[f]<65).sort((a,b)=>(bd.includes(b)-bd.includes(a))||(G.rel[a]-G.rel[b]));
  if(!cand.some(f=>bd.includes(f)))return null;
  const members=cand.slice(0,Math.min(6,2+Math.floor(pc/3)));if(members.length<2)return null;
  const leader=members.slice().sort((a,b)=>power(b)-power(a))[0];
  G.coal={members,leader,until:G.turn+12};members.forEach(f=>G.rel[f]=Math.max(0,G.rel[f]-15));logMsg(`${members.map(f=>FACTIONS[f].ruler).join('、')}會盟，結成${coalName()}`);
  return G.coal;}
// 聯軍合擊：盟員出兵攻我某城時，鄰近的其他盟員同時出兵
function coalitionJoin(warn){const out=[];const done={};
  for(const a of warn){if(!inCoal(a.f)||!G.armies.includes(a))continue;const t=a.to;done[t]=done[t]||0;
    for(const m of shuffle(G.coal.members.slice())){if(done[t]>=2)break;if(m===a.f||G.armies.some(x=>x.f===m&&x.to===t))continue;
      const src=citiesOf(m).filter(c=>ADJ[c.name].includes(t)&&c.troops>=4000&&offsIn(c.name).length>=1&&!(c.cool>G.turn)).sort((x,y)=>y.troops-x.troops)[0];if(!src)continue;
      const offs=offsIn(src.name).slice().sort((x,y)=>(y.lead+y.war)-(x.lead+x.war));const take=offs.length>1?offs.slice(0,Math.min(2,offs.length-1)):offs;
      const b=dispatch(m,src.name,t,take,Math.round(src.troops*.6/100)*100,isWater(src.name,t)?0:(src.siege||0));b.turns=Math.max(b.turns,a.turns);done[t]++;out.push(b);G.rel[m]=Math.max(0,G.rel[m]-6);}}

async function coalitionReport(co){const pl=G.player;const names=co.members.map(f=>FACTIONS[f].ruler);

function economy(){for(const c of Object.values(G.c))if(c.train)c.train=Math.max(0,c.train-1);for(const c of Object.values(G.c))if(!c.f&&c.base&&c.troops<c.base)c.troops=Math.min(c.base,Math.round(c.troops+c.base*.03));

  for(const c of cs){const i=cityIncome(c);g+=i.g;fd+=i.fd;up+=c.troops/25;c.pop=Math.round(c.pop*(1.002+c.farm/500000));}

function enemyReport(list){list=[].concat(list);const a=list[0],g=OF(a.offs[0]),F=FACTIONS[a.f],c=G.c[a.to],P=G.f[G.player];const multi=list.length>1;const tot=list.reduce((s,x)=>s+x.troops,0);

    options:[{label:'緊急徵兵',sub:'金 400・兵 +2000',fn:()=>{if(P.gold<400)return toast('金錢不足');P.gold-=400;c.troops+=2000;c.pop-=2000;toast(`${a.to}緊急徵兵 2000`);}},

function rollEvent(){if(R()>.3)return null;const cs=citiesOf(G.player);if(!cs.length)return null;const c=pick(cs),F=G.f[G.player],cd=CITY_BY[c.name];const k=pick(['locust','flood','rebel','plague','harvest','caravan','talent','rebel']);

async function endTurn(){if(BUSY||!G.player)return;AU.init();BUSY=true;closeSheet();refreshUI();
  try{
    G.armies.forEach(a=>a.prog=Math.min(1,a.prog+1/a.turns));syncArmies();await animateArmies(1400);
    const arr=G.armies.filter(a=>a.prog>=1);const pri=a=>(a.convoy?-5:0)+(a.f===G.player?3:G.c[a.to].f===G.player?2:0)-(a.support?1:0);arr.sort((a,b)=>pri(b)-pri(a));
    for(const a of arr){if(!G.armies.includes(a))continue;if(!G.f[a.f].alive){removeArmy(a);continue;}await resolveArrival(a);refreshMap();refreshUI();if(G.over)break;}
    if(!G.over){const co=coalitionMonthly();const warn=[];for(const f of shuffle(Object.keys(FACTIONS))){if(f===G.player||!G.f[f].alive)continue;warn.push(...aiTurn(f));}warn.push(...coalitionJoin(warn));if(warn.length)syncArmies();
      G.month++;if(G.month>12){G.month=1;G.year++;}G.turn++;economy();diploMonthly();if(G.lastInc){const L=G.lastInc;toast(`${G.month}月收支：金 +${fmt(L.g)}，糧 +${fmt(L.fd)}，軍糧 −${fmt(L.up)}`,4200);}G.o.forEach(o=>o.done=false);refreshMap();refreshUI();
      if(co)await coalitionReport(co);
      const grp={};for(const a of warn)if(G.armies.includes(a))(grp[a.to]=grp[a.to]||[]).push(a);
      for(const t in grp)await courierReport(enemyReport(grp[t]),grp[t][0].f);
      const ev=rollEvent();if(ev){if(ev.courier)await courierReport(ev,G.player);else toast(ev.text);}
      const pr=aiProposal();if(pr)await handleProposal(pr);}
  }catch(e){console.error(e);}
  BUSY=false;refreshMap();refreshUI();saveGame();await checkEnd();}
async function checkEnd(){if(!G.player)return;if(G.over==='lose'||!citiesOf(G.player).length){G.over='lose';await dlg('大業未竟',`<p>${FACTIONS[G.player].ruler}勢力已被消滅。勝敗乃兵家常事，請重新來過。</p>`,[{label:'重新開始',value:0,cls:'primary'}]);clearSave();showTitle();return;}

  const c=$('#tCont');if(c)c.onclick=()=>{try{const st=JSON.parse(loadRaw());registerCustom(st.custom||null);st.rel=st.rel||{};st.treaty=st.treaty||{};for(const k in FACTIONS){if(st.rel[k]==null)st.rel[k]=50;if(!st.f[k])st.f[k]={gold:0,food:0,alive:false};}startGame(st);}catch(e){console.error(e);toast('存檔讀取失敗');}};}
// ================= 自創勢力 =================
const ROLE_T={猛將:[[70,88],[86,97],[25,55],[20,50],[50,80]],統帥:[[85,95],[72,88],[62,82],[40,66],[62,86]],謀士:[[40,75],[15,45],[88,98],[66,88],[50,82]],政才:[[30,62],[15,40],[70,88],[88,98],[70,90]],全才:[[72,86],[66,82],[70,86],[66,82],[72,88]]};
const CUS_COLORS=['#e0b040','#ff7a3d','#e04f8a','#7a5cff','#22b8a8','#9acd32','#5aa0ff','#f2f2f2'];
function rollStats(role,ruler){const T=ROLE_T[role]||ROLE_T.全才;const v=T.map(([a,b])=>a+Math.floor(R()*(b-a+1)));if(ruler)v[4]=Math.max(v[4],82+Math.floor(R()*12));return{lead:v[0],war:v[1],int:v[2],pol:v[3],cha:v[4]};}
function createCustom(){return new Promise(res=>{
  const used=new Set([...OFFICER_DATA.split('\n').map(l=>l.split(',')[0]),...LADIES_DATA.map(l=>l.name)]);
  const P=[{name:'',role:'全才',female:false},{name:'',role:'猛將',female:false},{name:'',role:'統帥',female:false},{name:'',role:'謀士',female:false},{name:'',role:'政才',female:false}];
  const DEF=['李玄','韓烈','趙破虜','顧言','孫明'];P.forEach((p,i)=>{p.name=DEF[i];Object.assign(p,rollStats(p.role,i===0));});
  let color=CUS_COLORS[0];
  const row=(p,i)=>`<div class="cf-p" data-i="${i}"><div class="cf-h"><span class="cf-tag">${i===0?'君主':'部下 '+i}</span>
      <input class="cf-in" data-k="name" maxlength="4" value="${esc(p.name)}" aria-label="${i===0?'君主姓名':'部下姓名'}">
      <select class="cf-in" data-k="role" aria-label="類型">${Object.keys(ROLE_T).map(r=>`<option ${r===p.role?'selected':''}>${r}</option>`).join('')}</select>
      <select class="cf-in" data-k="female" aria-label="性別"><option value="0" ${p.female?'':'selected'}>男</option><option value="1" ${p.female?'selected':''}>女</option></select>
      <button class="btn cf-roll" data-roll="${i}" aria-label="重擲能力">擲</button></div>
      <div class="cf-st">統 <b>${p.lead}</b>　武 <b>${p.war}</b>　智 <b>${p.int}</b>　政 <b>${p.pol}</b>　魅 <b>${p.cha}</b></div></div>`;
  const m=modal(`<h3>自創勢力</h3><div class="sub">自訂君主與四名文武部下（共 5 人，與其他諸侯相同）。類型決定能力傾向，按「擲」可重擲能力。</div>
    <div class="cf-grid"><label>旗號<input class="cf-in" id="cfFlag" maxlength="1" value="玄"></label><label>國號<input class="cf-in" id="cfDyn" maxlength="2" value="" placeholder="同旗號"></label></div>
    <div class="cf-col" id="cfCol">${CUS_COLORS.map(c=>`<button class="cf-sw ${c===color?'on':''}" data-c="${c}" style="--c:${c}" aria-label="旗色"></button>`).join('')}</div>
    <div id="cfPeople">${P.map(row).join('')}</div>
    <p class="cf-err" id="cfErr" role="alert"></p><div class="row"><button class="btn" id="cfX">取消</button><button class="btn primary" id="cfOK">下一步：選擇城池</button></div>`);m.classList.add('ztop');const err=t=>{$('#cfErr').textContent=t;};
  const redraw=i=>{const el=m.querySelector(`.cf-p[data-i="${i}"]`);el.outerHTML=row(P[i],i);bind();};
  function bind(){m.querySelectorAll('.cf-p').forEach(el=>{const i=+el.dataset.i;el.querySelectorAll('[data-k]').forEach(inp=>{inp.onchange=inp.oninput=()=>{const k=inp.dataset.k;if(k==='name')P[i].name=inp.value.trim();else if(k==='female')P[i].female=inp.value==='1';else if(k==='role'&&inp.value!==P[i].role){P[i].role=inp.value;Object.assign(P[i],rollStats(P[i].role,i===0));redraw(i);}};});
    el.querySelector('[data-roll]').onclick=()=>{Object.assign(P[i],rollStats(P[i].role,i===0));AU.click&&AU.click();redraw(i);};});}
  bind();
  m.querySelectorAll('.cf-sw').forEach(b=>b.onclick=()=>{color=b.dataset.c;m.querySelectorAll('.cf-sw').forEach(x=>x.classList.toggle('on',x===b));});
  $('#cfX').onclick=()=>{closeModal();res(null);};
  $('#cfOK').onclick=async()=>{const names=P.map(p=>p.name.trim());const flag=$('#cfFlag').value.trim(),dyn=$('#cfDyn').value.trim()||flag;
    if(names.some(n=>!n))return err('每位人物都要取名');if(new Set(names).size<5)return err('人物名字不能重複');const dup=names.find(n=>used.has(n));if(dup)return err(`「${dup}」與現有人物同名，請改名`);if(!flag)return err('請輸入一字旗號');
    const snap=P.map(p=>Object.assign({},p,{name:p.name.trim()}));closeModal();
    const ents=CITIES.filter(cd=>!Object.values(CAPITALS).includes(cd.name));
    setTimeout(()=>$('#modal').classList.add('ztop'),0);const city=await choose('選擇自立之城','起兵：兵 5,000・糧 50,000・金 5,000（與其他諸侯相同）',ents.map(cd=>{const c=G.c[cd.name],i=cityIncome(c),sp=specOf(cd.name);const nb=[...new Set(ADJ[cd.name].map(n=>Object.keys(CAPITALS).find(k=>CAPITALS[k]===n)).filter(Boolean))].map(k=>FACTIONS[k].ruler);
      return{id:cd.name,label:cd.name,meta:`${'大中小'[3-cd.size]||'小'}城・月收 金 ${i.g}・糧 ${fmt(i.fd)}${sp?'・'+sp:''}${nb.length?'・鄰 '+nb.join('、'):'・周邊無諸侯'}`};}));
    if(!city){res(null);return;}
    res({ruler:snap[0].name,flag,dyn,color,city,offs:snap.map(p=>({name:p.name,lead:p.lead,war:p.war,int:p.int,pol:p.pol,cha:p.cha,female:p.female}))});};});}
function startGame(st){AU.init();G=st;VOICE.on=G.set.voice!==false;$('#title').hidden=true;MAP.titleSpin=false;$('#ui').hidden=false;clearArmyModels();BUSY=false;
  refreshMap();refreshUI();const cap=citiesOf(G.player).sort((a,b)=>CITY_BY[b.name].size-CITY_BY[a.name].size)[0];if(cap)flyTo(cap.name,48);
  toast(`${G.year}年${G.month}月，${FACTIONS[G.player].ruler}的霸業由此開始。點選城池下達命令。`,5000);saveGame();}

// ================= 啟動 =================
$('#bEnd').onclick=endTurn;$('#bLord').onclick=menuLord;$('#bInfo').onclick=()=>{if(!BUSY)showInfo();};$('#bCouncil').onclick=doCouncil;$('#bDiplo').onclick=()=>guard(()=>doDiplomacy());
window.addEventListener('error',e=>{const b=document.getElementById('boot');if(b&&!b.hidden){document.getElementById('bootMsg').textContent='載入失敗：'+(e.message||'未知錯誤')+'。請重新整理，或改用 Safari / Chrome。';}});
(function boot(){if(!window.THREE){document.getElementById('bootMsg').textContent='無法載入 3D 引擎，請檢查網路後重新整理。';return;}
  setTimeout(()=>{G=newState(null);const v=buildMap();setView(v);refreshMap();loop();showTitle();requestAnimationFrame(()=>requestAnimationFrame(()=>{$('#boot').hidden=true;}));},60);})();
</script>
